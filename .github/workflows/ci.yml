name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily real-upstream compatibility sweep (baseline + latest image digest).
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PNPM_VERSION: 10.11.0
  NODE_VERSION: 24
  # Upstream frontend builds OOM at the runner default heap (exit 134); bound it.
  SUB2API_BUILD_NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Build debug binary
        run: cargo build --locked

      - name: Install Node for license gate
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust production dependency notices
        run: node scripts/release-licenses.mjs rust

      - name: Upload Cshell binary for real-backend jobs
        uses: actions/upload-artifact@v4
        with:
          name: cshell-binary-${{ github.sha }}
          path: target/debug/cshell
          retention-days: 3
          if-no-files-found: error

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Resolve runtime notices and verify release artifact
        run: |
          node ../scripts/release-licenses.mjs npm
          node ../scripts/release-artifacts.mjs package
          node ../scripts/release-artifacts.mjs check

      - name: Upload web dist for real-backend jobs
        uses: actions/upload-artifact@v4
        with:
          name: cshell-web-dist-${{ github.sha }}
          path: web/dist
          retention-days: 3
          if-no-files-found: error

  proxy-smoke:
    name: Proxy smoke test
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build debug binary
        run: cargo build --locked

      - name: Run proxy smoke test
        run: node scripts/proxy-smoke.mjs --binary target/debug/cshell

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cshell:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image release contents without starting services
        run: |
          set -euo pipefail
          cid=$(docker create cshell:ci)
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker export "$cid" -o "$RUNNER_TEMP/cshell-image.tar"
          python3 scripts/release-image-check.py "$RUNNER_TEMP/cshell-image.tar"

  # Real Sub2API matrix: pinned source baseline + official latest image (digest-pinned).
  # The same harness, API suite and browser suite run against both; both must pass.
  sub2api-integration:
    name: Real Sub2API integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        backend: [baseline-source, latest-image]
    env:
      SUB2API_TEST_EMAIL: cshell-ci-${{ github.run_id }}-${{ matrix.backend }}@example.invalid
      SUB2API_TEST_PASSWORD: CshellCI-only-password-123
      CI_REGISTRATION_ENABLED: "true"
    steps:
      - name: Checkout Cshell
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Cshell binary
        uses: actions/download-artifact@v4
        with:
          name: cshell-binary-${{ github.sha }}
          path: target/debug

      - name: Make binary executable
        run: chmod +x target/debug/cshell

      - name: Resolve upstream reference
        run: |
          set -euo pipefail
          node scripts/sub2api-ci-upstream.mjs resolve ${{ matrix.backend }}

      - name: Start isolated real Sub2API
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs up ${{ matrix.backend }}

      - name: Configure open registration on real backend
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs configure ${{ matrix.backend }}

      - name: Start Cshell proxying the real upstream
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-static"
          SUB2API_UPSTREAM=http://127.0.0.1:18081 \
            CSHELL_LISTEN=127.0.0.1:18080 \
            CSHELL_STATIC_DIR="$RUNNER_TEMP/empty-static" \
            ./target/debug/cshell >"$RUNNER_TEMP/cshell.log" 2>&1 &
          cshell_pid=$!
          echo "CSHELL_PID=$cshell_pid" >> "$GITHUB_ENV"
          trap 'kill "$cshell_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/_cshell/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/cshell.log" || true
          exit 1

      - name: Run real-upstream API checks
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs manifest ${{ matrix.backend }}
          CSHELL_BASE_URL=http://127.0.0.1:18080 \
            SUB2API_UPSTREAM_ID="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.SUB2API_MANIFEST || process.env.RUNNER_TEMP + '/sub2api-manifest-${{ matrix.backend }}.json','utf8')).reference)")" \
            node scripts/sub2api-integration.mjs

      - name: Collect sanitized diagnostics and stop upstream
        if: always()
        run: |
          set +e
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs down ${{ matrix.backend }} || true
          kill "$CSHELL_PID" 2>/dev/null || true
          sed -E 's/(PASSWORD|JWT_SECRET|REDIS_PASSWORD|DATABASE_PASSWORD)[=:][^ ]*/\1=[REDACTED]/g; s/cshell-ci-[^ @]*/cshell-ci-[REDACTED]/g' \
            "$RUNNER_TEMP/cshell.log" > "$RUNNER_TEMP/cshell-sanitized.log" 2>/dev/null || true

      - name: Upload manifest and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-integration-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/sub2api-manifest-*.json
            ${{ runner.temp }}/cshell-sanitized.log
          if-no-files-found: ignore

  # Production web/dist driven by a real backend through the real Cshell proxy.
  sub2api-browser:
    name: Real Sub2API browser (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        backend: [baseline-source, latest-image]
    env:
      SUB2API_TEST_EMAIL: cshell-ci-${{ github.run_id }}-${{ matrix.backend }}-browser@example.invalid
      SUB2API_TEST_PASSWORD: CshellCI-only-password-123
    steps:
      - name: Checkout Cshell
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Cshell binary
        uses: actions/download-artifact@v4
        with:
          name: cshell-binary-${{ github.sha }}
          path: target/debug

      - name: Make binary executable
        run: chmod +x target/debug/cshell

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: cshell-web-dist-${{ github.sha }}
          path: web-dist

      - name: Install Playwright Chromium
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps

      - name: Start isolated real Sub2API
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs up ${{ matrix.backend }}

      - name: Configure open registration on real backend
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs configure ${{ matrix.backend }}

      - name: Start Cshell with production web dist
        run: |
          set -euo pipefail
          SUB2API_UPSTREAM=http://127.0.0.1:18081 \
            CSHELL_LISTEN=127.0.0.1:18080 \
            CSHELL_STATIC_DIR="$GITHUB_WORKSPACE/web-dist" \
            ./target/debug/cshell >"$RUNNER_TEMP/cshell.log" 2>&1 &
          cshell_pid=$!
          echo "CSHELL_PID=$cshell_pid" >> "$GITHUB_ENV"
          trap 'kill "$cshell_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/_cshell/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/cshell.log" || true
          exit 1

      - name: Run real-backend browser acceptance
        env:
          SUB2API_BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-artifacts
        run: |
          set -euo pipefail
          CSHELL_BASE_URL=http://127.0.0.1:18080 \
            CHROME_PATH= \
            node scripts/sub2api-browser.mjs

      - name: Collect sanitized diagnostics and stop upstream
        if: always()
        run: |
          set +e
          CONTAINER_ENGINE=docker node scripts/sub2api-ci-upstream.mjs down ${{ matrix.backend }} || true
          kill "$CSHELL_PID" 2>/dev/null || true
          sed -E 's/(PASSWORD|JWT_SECRET|TOKEN)[=:][^ ]*/\1=[REDACTED]/g' \
            "$RUNNER_TEMP/cshell.log" > "$RUNNER_TEMP/cshell-sanitized.log" 2>/dev/null || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-browser-${{ matrix.backend }}
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore

  # Aggregate, always-run gate: any failed/cancelled/skipped dependency fails CI.
  # Configure this stable check as the required branch-protection check.
  ci-required:
    name: CI required aggregate
    runs-on: ubuntu-latest
    needs:
      [rust, web, proxy-smoke, docker, sub2api-integration, sub2api-browser]
    if: always()
    steps:
      - name: Evaluate dependency results
        run: |
          set -euo pipefail
          failed=0
          for result in "${{ join(needs.*.result, ' ') }}"; do
            if [ "$result" != "success" ]; then
              echo "dependency result: $result"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required CI jobs did not succeed"
            exit 1
          fi
          echo "All required CI jobs succeeded"
